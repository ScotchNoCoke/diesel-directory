<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160" fill="none">
  <defs>
    <pattern id="hazardStripe" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#F59E0B" />
      <rect x="10" width="10" height="20" fill="#09090B" />
    </pattern>
  </defs>

  <!-- 24/7 Geolocation Marker Pin -->
  <g transform="translate(10, 10)">
    <!-- Pin Body -->
    <path d="M70,5 C34.1,5 5,34.1 5,70 C5,108 70,145 70,145 C70,145 135,108 135,70 C135,34.1 105.9,5 70,5 Z" fill="#F59E0B" />
    <!-- Pin Cutout -->
    <circle cx="70" cy="65" r="40" fill="#09090B" />
    <!-- 24/7 Text -->
    <text x="70" y="74" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="0.5">24/7</text>
  </g>

  <!-- Wordmark Group -->
  <g transform="translate(170, 0)">
    <!-- Top Word: DIESEL -->
    <text x="0" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', 'Impact', sans-serif" font-size="62" font-weight="900" letter-spacing="4">DIESEL</text>
    
    <!-- Top Word: HUB -->
    <text x="280" y="65" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', 'Impact', sans-serif" font-size="62" font-weight="900" letter-spacing="4">HUB</text>

    <!-- Hazard Divider Line -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="560" height="12" fill="url(#hazardStripe)" rx="2" />
      <rect x="0" y="0" width="560" height="2" fill="#F59E0B" />
      <rect x="0" y="10" width="560" height="2" fill="#F59E0B" />
    </g>

    <!-- Subtitle: LINEHAUL BREAKDOWN DIRECTORY -->
    <text x="2" y="124" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', 'Trebuchet MS', sans-serif" font-size="20" font-weight="800" letter-spacing="6">LINEHAUL BREAKDOWN DIRECTORY</text>
  </g>
</svg>
