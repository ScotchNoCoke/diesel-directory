<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sharp hazard stripe pattern -->
    <pattern id="hazardStripe" width="28" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="20" fill="#F59E0B" />
      <rect x="14" width="14" height="20" fill="#09090B" />
    </pattern>
  </defs>

  <!-- Group: 24/7 Geolocation Pin -->
  <g id="map-pin" transform="translate(18, 10)">
    <!-- Pin outer teardrop shape -->
    <path 
      d="M140,20 C62.7,20 0,82.7 0,160 C0,250 140,360 140,360 C140,360 280,250 280,160 C280,82.7 217.3,20 140,20 Z" 
      fill="#F59E0B"
    />
    <!-- Pin inner dark cutout circle -->
    <circle cx="140" cy="160" r="82" fill="#09090B" />
    <!-- "24/7" badge text -->
    <text 
      x="140" 
      y="178" 
      fill="#F59E0B" 
      font-family="'Impact', 'Arial Black', sans-serif" 
      font-size="62" 
      font-weight="900" 
      text-anchor="middle" 
      letter-spacing="1"
    >24/7</text>
  </g>

  <!-- Group: Wordmark -->
  <!-- Top line: DIESEL in high-vis steel white -->
  <text 
    x="320" 
    y="145" 
    fill="#E2E8F0" 
    font-family="'Impact', 'Arial Black', sans-serif" 
    font-size="142" 
    letter-spacing="5"
  >DIESEL</text>

  <!-- Bottom line: HUB in heavy amber -->
  <text 
    x="320" 
    y="300" 
    fill="#F59E0B" 
    font-family="'Impact', 'Arial Black', sans-serif" 
    font-size="182" 
    font-weight="900" 
    letter-spacing="2"
  >HUB</text>

  <!-- Accent Divider: Industrial Hazard Stripe Bar -->
  <g id="hazard-bar" transform="translate(18, 325)">
    <rect x="0" y="0" width="964" height="18" fill="url(#hazardStripe)" />
    <!-- Bounding accent rules -->
    <rect x="0" y="0" width="964" height="2" fill="#F59E0B" />
    <rect x="0" y="16" width="964" height="2" fill="#F59E0B" />
  </g>

  <!-- Subtitle: BREAKDOWN DIRECTORY -->
  <text 
    x="18" 
    y="390" 
    fill="#94A3B8" 
    font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
    font-size="44" 
    font-weight="900" 
    letter-spacing="14"
  >BREAKDOWN DIRECTORY</text>
</svg>
