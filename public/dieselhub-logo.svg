<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="55%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
    <filter id="heavyDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <pattern id="hazardPattern" width="30" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="15" height="20" fill="#F59E0B" />
      <rect x="15" width="15" height="20" fill="#18181B" />
    </pattern>
  </defs>

  <!-- Left: Linehaul Shield with Prime-Mover Grille -->
  <g transform="translate(40, 20)" filter="url(#shieldGlow)">
    <polygon points="170,10 300,50 300,220 170,320 40,220 40,50" fill="#18181B" stroke="#3F3F46" stroke-width="12" stroke-linejoin="round"/>
    <polygon points="170,26 284,62 284,212 170,300 56,212 56,62" fill="#09090B" stroke="url(#amberGrad)" stroke-width="7" stroke-linejoin="round"/>

    <g filter="url(#heavyDrop)">
      <!-- Dual Chrome Exhaust Stacks -->
      <rect x="100" y="45" width="10" height="70" rx="3" fill="#94A3B8" stroke="#334155" stroke-width="2" />
      <rect x="230" y="45" width="10" height="70" rx="3" fill="#94A3B8" stroke="#334155" stroke-width="2" />
      <polygon points="120,68 220,68 210,58 130,58" fill="#475569" />
      <!-- Cab Roof & Windshield -->
      <path d="M110,115 L125,72 L215,72 L230,115 Z" fill="#334155" stroke="#0F172A" stroke-width="3" />
      <rect x="130" y="78" width="36" height="28" rx="2" fill="#0284C7" opacity="0.85" />
      <rect x="174" y="78" width="36" height="28" rx="2" fill="#0284C7" opacity="0.85" />
      <!-- Grille Structure -->
      <rect x="122" y="112" width="96" height="88" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="5" />
      <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round">
        <line x1="138" y1="126" x2="138" y2="186" /><line x1="148" y1="126" x2="148" y2="186" />
        <line x1="158" y1="126" x2="158" y2="186" /><line x1="168" y1="126" x2="168" y2="186" />
        <line x1="178" y1="126" x2="178" y2="186" /><line x1="188" y1="126" x2="188" y2="186" />
        <line x1="198" y1="126" x2="198" y2="186" /><line x1="206" y1="126" x2="206" y2="186" />
      </g>
      <!-- Headlights & Heavy Bumper -->
      <rect x="76" y="160" width="44" height="26" rx="4" fill="#334155" stroke="#0F172A" stroke-width="2" />
      <rect x="220" y="160" width="44" height="26" rx="4" fill="#334155" stroke="#0F172A" stroke-width="2" />
      <rect x="70" y="196" width="200" height="38" rx="6" fill="#475569" stroke="#0F172A" stroke-width="4" />
      <line x1="66" y1="202" x2="274" y2="202" stroke="#94A3B8" stroke-width="4" />
      <line x1="66" y1="228" x2="274" y2="228" stroke="#94A3B8" stroke-width="4" />
    </g>

    <!-- Geolocation Nexus Pin -->
    <g transform="translate(170, 155)" filter="url(#heavyDrop)">
      <path d="M0,-34 C-16,-34 -28,-22 -28,-6 C-28,14 0,40 0,40 C0,40 28,14 28,-6 C28,-22 16,-34 0,-34 Z" fill="url(#amberGrad)" stroke="#18181B" stroke-width="4"/>
      <circle cx="0" cy="-8" r="8" fill="#18181B" />
    </g>
  </g>

  <!-- Right: Wordmark & Classification Stripe -->
  <g transform="translate(410, 80)">
    <g fill="url(#chromeGrad)" stroke="#09090B" stroke-width="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="124" letter-spacing="4">
      <text x="0" y="112">DIESEL</text>
    </g>
    <g fill="url(#amberGrad)" stroke="#09090B" stroke-width="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="124" letter-spacing="6">
      <text x="445" y="112">HUB</text>
    </g>
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="700" height="20" rx="3" fill="url(#hazardPattern)" stroke="#F59E0B" stroke-width="2" />
    </g>
    <text x="4" y="200" fill="#E4E4E7" font-family="'Barlow Condensed', 'Trebuchet MS', 'Arial', sans-serif" font-size="24" font-weight="900" letter-spacing="3.5">
      LINEHAUL BREAKDOWN &amp; HEAVY TRANSPORT SERVICE DIRECTORY
    </text>
  </g>
</svg>
